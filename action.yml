name: Setup Node and pnpm
description: Setup Node.js and pnpm with caching

inputs:
  registry-url:
    default: 'https://registry.npmjs.org'
    required: false
    type: string
    description: 'Optional registry to set up for auth. Will set the registry in a project level .npmrc and .yarnrc file, and set up auth to read in from env.NODE_AUTH_TOKEN.'

  scope:
    required: false
    type: string
    description: 'Optional scope for authenticating against scoped registries. Will fall back to the repository owner when using the GitHub Packages registry (https://npm.pkg.github.com/).'

  architecture:
    required: false
    description: 'Optional architecture for Node.js (e.g., x64, arm64). If not specified, defaults to the runner architecture.'

  cpu:
    required: false
    description: 'Optional CPU architecture for pnpm supportedArchitectures configuration (e.g., x64, arm64).'

runs:
  using: composite
  steps:
    # actions/setup-node only ships glibc Node binaries; on Alpine those can't
    # run, so use the container's musl Node instead.
    - name: Detect Alpine Linux
      id: detect
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ -f /etc/alpine-release ]; then
          echo "is-alpine=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      if: steps.detect.outputs.is-alpine != 'true'
      with:
        node-version-file: .node-version
        architecture: ${{ inputs.architecture }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        package-manager-cache: false
        # see pnpm cache setting below

    - name: Get pnpm store directory
      id: store
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    # actions/cache (Node) intermittently hard-crashes on Windows runners with
    # STATUS_STACK_BUFFER_OVERRUN (exit code 0xC0000409), dying with no error
    # message and failing the job. Caching is a non-essential optimization, so
    # never let it fail the build. See actions/cache#1754.
    - name: Save and restore pnpm cache on main
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ github.ref_name == 'main' }}
      continue-on-error: true
      with:
        path: ${{ steps.store.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Restore pnpm cache on PR
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ github.ref_name != 'main' }}
      continue-on-error: true
      with:
        path: ${{ steps.store.outputs.STORE_PATH }}
        key: |
          ${{ runner.os }}-pnpm-store-

    - name: Set CPU architecture for pnpm
      if: ${{ inputs.cpu }}
      shell: bash
      run: node -e 'console.log(`\nsupportedArchitectures:\n  cpu:\n    - ${process.env.CPU_ARCH}`)' >> pnpm-workspace.yaml
      env:
        CPU_ARCH: ${{ inputs.cpu }}

    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
